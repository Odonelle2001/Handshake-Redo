<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handshake Mock – Chat</title>
  <link rel="stylesheet" href="Css/HomePage.css">
</head>
<body>

  <!-- NAVBAR (same as Home) -->
  <header class="navbar">
    <div class="nav-left">
      <div class="logo">H</div>

      <nav class="nav-links">
        <a href="Homepage.html">Home</a>
        <a href="FeedPage.html">Feed</a>
        <a href="FeedPage.html">Explore</a>
        <a href="FeedPage.html">Inbox</a>
        <a href="FeedPage.html">Jobs</a>
        <a href="FeedPage.html">Events</a>
        <a href="FeedPage.html">People</a>
        <a href="CareerCenter.html">Career Center</a>
      </nav>
    </div>

    <div class="nav-right">
      <button class="btn-outlined">Log out</button>
      <div class="nav-avatar">
        <img src="Images/ProfileIcon.png" alt="User">
      </div>
    </div>
  </header>

  <!-- CHAT CONTENT -->
  <main class="chat-shell">
    <section class="chat-panel">
      <div class="chat-header">
        Chat with Career Center
      </div>

      <div class="chat-messages">
        <div class="msg msg-them">
          Hi Lucas! 👋 How can the Career Center help you today?
        </div>

        <div class="msg msg-me">
          Hi! I’d like some help finding IT internships for next summer.
        </div>

        <div class="msg msg-them">
          Awesome! We can start by updating your résumé and then looking at Handshake postings together.
        </div>
      </div>

      <form class="chat-input-row">
        <input type="text" placeholder="Type a message..." />
        <button type="button">Send</button>
      </form>
    </section>
  </main>

</body>
</html>
