<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Handshake Mock – Career Center</title>
  <link rel="stylesheet" href="Css/styles.css">
   <script src="main.js"></script>
</head>
<body>

<header class="navbar">
   <img src="Screenshot (520).png" alt="Handshake Logo" class="logo">

  <nav class="nav-links">
   <a href="Homepage.html" class="active">Home</a>
      <a href="FeedPage.html"class="active">Feed</a>
      <a href="feed.html">Explore</a>
      <a href="feed.html">Inbox</a>
      <a href="feed.html">Jobs</a>
      <a href="feed.html">Events</a>
      <a href="feed.html">People</a>
    <a href="CareerCenter.html" class="active">Career Center</a>
  </nav>

  <div class="nav-right">
    <button class="outline-btn" onclick="location.href='index.html'">Log out</button>
    <div class="nav-avatar"></div>
  </div>
</header>

<main class="page-shell">

  <!-- top banner / tabs -->
  <section class="career-hero">
    <div class="career-banner">
      <div class="career-banner-title">
        Metro State University – Career Center
      </div>
    </div>

    <div class="career-tabs">
      <button class="green-btn" onclick="location.href='career-center.html'">Schedule Appointment</button>
      <button class="outline-btn">About Us</button>
      <button class="outline-btn">Contact Us</button>
      <button class="outline-btn">Resources</button>
    </div>
  </section>

  <!-- main 2-column content -->
  <div class="career-main-grid">
    <!-- left: vertical buttons -->
    <aside class="career-left-card">
      <button class="green-btn">Resume Drop-In</button>
      <button class="green-btn">Help with Interview</button>
      <button class="green-btn">Interview Prep</button>
      <button class="green-btn">Career Fairs</button>
      <button class="outline-btn">View Full Collection</button>
    </aside>

    <!-- right: featured collections -->
    <section class="career-right-card">
      <h2 class="section-title">Featured Collections</h2>
      <input class="collection-search" placeholder="Search by collection">

      <div class="collection-item">
        <div class="collection-icon"></div>
        <span>Create Social Impact</span>
      </div>

      <div class="collection-item">
        <div class="collection-icon"></div>
        <span>Career Fair Employment</span>
      </div>

      <div class="collection-item">
        <div class="collection-icon"></div>
        <span>Hidden Gems</span>
      </div>

      <div class="collection-item">
        <div class="collection-icon"></div>
        <span>Hire From our School</span>
      </div>

      <div class="collection-item">
        <div class="collection-icon"></div>
        <span>Invest in Diversity</span>
      </div>

      <div class="collection-item">
        <div class="collection-icon"></div>
        <span>Popular With Alumni</span>
      </div>

      <div class="meet-team-btn">
        Click here to meet our team
      </div>
    </section>
  </div>
</main>

</body>
</html>
